name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check the tag matches the version
        run: test "v$(jq -r .version package.json)" = "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Pack
        run: |
          set -euo pipefail
          mkdir dist
          bun pm pack --destination dist
          test "$(find dist -name '*.tgz' | wc -l)" -eq 1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish
        run: gh release create "$TAG" dist/*.tgz --verify-tag --title "$TAG" --generate-notes
